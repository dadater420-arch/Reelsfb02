<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src https: data:; connect-src https://hajdefougllyugmamwdn.supabase.co; base-uri 'none'; form-action 'none'">
<title>reelmate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d13;--surface:#12161f;--surface2:#171c28;--surface3:#1e2534;--line:#242c3d;--text:#eef2f8;--muted:#9aa7bd;--primary:#2f7dff;--primary2:#4d9bff;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--cyan:#22d3ee}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Kanit',system-ui,sans-serif;line-height:1.5;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}
button:disabled{opacity:.5;cursor:not-allowed}
a{color:var(--primary2);overflow-wrap:anywhere}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(47,125,255,.18)}
input[type=checkbox]{width:20px;height:20px;padding:0}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
.wrap{max-width:1100px;margin:0 auto;padding:12px 14px 40px}
.auth{max-width:440px;margin:0 auto;padding:40px 16px}
.logo{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:800}
.logo b{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--primary);box-shadow:0 8px 20px rgba(47,125,255,.3)}
.logo i{font-style:normal;color:var(--primary2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
.sub{background:var(--surface2);border-radius:16px;padding:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.grid{display:grid;gap:12px}
@media(min-width:720px){.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c4{grid-template-columns:repeat(4,1fr)}}
.btn{padding:11px 16px;border-radius:12px;background:var(--primary);color:#fff;font-weight:700;font-size:14px}
.btn:hover:not(:disabled){background:var(--primary2)}
.btn.g{background:rgba(255,255,255,.1)}.btn.r{background:rgba(239,68,68,.18);color:#fca5a5}.btn.ok{background:var(--green);color:#04130a}.btn.a{background:rgba(245,158,11,.2);color:#fcd34d}
.btn.s{padding:8px 12px;font-size:12px}.btn.w{width:100%}
.tabs{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:16px;overflow-x:auto}
.tabs button{flex:1;padding:10px 14px;border-radius:12px;background:none;color:var(--muted);font-weight:700;font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--primary);color:#fff}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(255,255,255,.08);color:var(--muted)}
.pill.g{background:#22c55e22;color:#4ade80}.pill.a{background:#f59e0b22;color:#fbbf24}.pill.r{background:#ef444422;color:#f87171}.pill.b{background:#2f7dff22;color:#7db4ff}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#22d3ee)}
.muted{color:var(--muted);font-size:13px}
.cover{position:relative;height:180px;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#fff}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover span{position:relative;font-weight:700;text-shadow:0 1px 4px #0008}
.err{background:#ef444418;color:#f87171;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:10px}
.warn{background:#f59e0b18;border:1px solid #f59e0b55;color:#fcd34d;border-radius:16px;padding:12px 14px;font-size:13px;font-weight:600;margin-top:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0b2a17;border:1px solid #22c55e66;padding:12px 18px;border-radius:14px;z-index:99;font-weight:600;max-width:90vw}
.toast.bad{background:#2a0b0b;border-color:#ef444466}
.mask{position:fixed;inset:0;background:#000b;z-index:50;display:grid;place-items:center;padding:14px}
.modal{width:min(480px,100%);max-height:90vh;overflow:auto;background:var(--surface2);border:1px solid var(--line);border-radius:24px;padding:20px;position:relative}
.modal h3{margin:0 0 4px;font-size:19px}
.x{position:absolute;right:14px;top:14px;background:rgba(255,255,255,.1);border-radius:10px;width:34px;height:34px}
.head{position:sticky;top:0;z-index:20;background:#0a0d13ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700}
.stat{font-size:26px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 6px;text-align:left;border-bottom:1px solid #ffffff10}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script>
'use strict';
/* ============ ตั้งค่า (publishable key เปิดเผยได้ ความปลอดภัยอยู่ที่ RLS ฝั่งฐานข้อมูล) ============ */
const SB_URL = 'https://hajdefougllyugmamwdn.supabase.co';
const SB_KEY = 'sb_publishable_nfamPECiovzrLjkzPtTOJg_E9MDNb75';
const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

/* ============ ตัวช่วย ============ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? esc(u) : '#';
const httpsUrl = u => /^https:\/\//i.test(u || '') ? esc(u) : '';
const REEL_RE = /^https?:\/\/([a-z0-9-]+\.)*(facebook\.com|fb\.watch|fb\.com|fb\.gg|instagram\.com|instagr\.am)(\/|$)/i;
const fmt = d => new Date(d).toLocaleString('th-TH', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
const today = () => new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Bangkok'}).format(new Date());
const code = p => 'RM' + String(p.member_no).padStart(3, '0');
const ini = s => (s || '?').trim().slice(0, 1).toUpperCase();
const GRAD = ['#2563eb,#06b6d4','#7c3aed,#db2777','#059669,#14b8a6','#ea580c,#f43f5e','#1d4ed8,#7c3aed'];
const grad = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `linear-gradient(135deg,${GRAD[h % GRAD.length]})`; };
const pct = (a, b) => Math.min(100, Math.round(a / Math.max(1, b) * 100));
const $ = id => document.getElementById(id);
const val = id => ($(id)?.value ?? '').trim();

let tt; function toast(msg, bad) {
  $('toast').innerHTML = `<div class="toast ${bad ? 'bad' : ''}">${esc(msg)}</div>`;
  clearTimeout(tt); tt = setTimeout(() => $('toast').innerHTML = '', 3500);
}
const niceErr = e => {
  const m = e?.message || String(e);
  if (/Invalid login/i.test(m)) return 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
  if (/already registered|duplicate key|profiles_username_key/i.test(m)) return 'ชื่อผู้ใช้นี้มีคนใช้แล้ว';
  if (/rate limit|too many/i.test(m)) return 'ลองบ่อยเกินไป รอสักครู่แล้วลองใหม่';
  if (/Password should/i.test(m)) return 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
  return m;
};

/* ============ สถานะ ============ */
const S = { ready:false, mode:'login', me:null, set:null, tab:'feed', atab:'overview', platform:'ทั้งหมด',
  feed:[], myReels:[], myHelps:[], board:[], gate:null, modal:null, adm:null, busy:false, err:'' };

/* ============ โหลดข้อมูล ============ */
async function load() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { S.me = null; S.ready = true; return render(); }
  const uid = session.user.id;
  const [me, set, feed, mine, helps, board, gate] = await Promise.all([
    sb.from('profiles').select('*').eq('id', uid).maybeSingle(),
    sb.from('settings').select('*').eq('id', 1).single(),
    sb.rpc('get_feed', { p_platform: S.platform === 'ทั้งหมด' ? null : S.platform }),
    sb.from('reels').select('*').eq('owner_id', uid).order('posted_at', { ascending: false }),
    sb.from('helps').select('id,reel_id,clip_title,typed,status,helped_date,created_at').eq('helper_id', uid).order('created_at', { ascending: false }).limit(50),
    sb.rpc('get_leaderboard'),
    sb.rpc('can_post_reel')
  ]);
  if (!me.data) { await sb.auth.signOut(); S.me = null; S.ready = true; return render(); }
  Object.assign(S, { me: me.data, set: set.data, feed: feed.data || [], myReels: mine.data || [],
    myHelps: helps.data || [], board: board.data || [], gate: gate.data, ready: true });
  if (S.me.role === 'admin' && S.tab === 'admin') await loadAdmin();
  render();
}
async function loadAdmin() {
  const [users, reels, helps, reports, credits] = await Promise.all([
    sb.from('profiles').select('*').order('member_no'),
    sb.from('reels').select('*,profiles(display_name)').order('posted_at', { ascending: false }).limit(200),
    sb.from('helps').select('*,profiles(display_name)').order('created_at', { ascending: false }).limit(200),
    sb.from('reports').select('*,profiles(display_name),reels(title,link)').order('created_at', { ascending: false }).limit(200),
    sb.from('credit_logs').select('*,profiles!credit_logs_user_id_fkey(display_name)').order('created_at', { ascending: false }).limit(100)
  ]);
  S.adm = { users: users.data || [], reels: reels.data || [], helps: helps.data || [], reports: reports.data || [], credits: credits.data || [] };
}
async function go(fn, okMsg) {
  if (S.busy) return; S.busy = true;
  try { await fn(); if (okMsg) toast(okMsg); S.modal = null; S.err = ''; await load(); }
  catch (e) { S.err = niceErr(e); toast(niceErr(e), true); render(); }
  finally { S.busy = false; }
}
const must = r => { if (r.error) throw r.error; return r.data; };

/* ============ มุมมอง ============ */
const view = {};
view.auth = () => `
<div class="auth">
  <div class="logo"><b>R</b><span>reel<i>mate</i></span></div>
  <p class="muted" style="margin:10px 0 18px">ช่วยกันคนละนิด เติบโตไปด้วยกัน</p>
  <div class="card">
    <div class="tabs"><button class="${S.mode==='login'?'on':''}" data-act="mode" data-v="login">เข้าสู่ระบบ</button><button class="${S.mode==='signup'?'on':''}" data-act="mode" data-v="signup">สมัครสมาชิก</button></div>
    <form data-form="${S.mode}" autocomplete="on">
      ${S.mode==='signup'?`<label for="f-name">ชื่อที่แสดง</label><input id="f-name" maxlength="60" placeholder="เช่น บ้านๆนี่แหละ" required>`:''}
      <label for="f-user">ชื่อผู้ใช้</label><input id="f-user" maxlength="30" autocomplete="username" placeholder="ภาษาอังกฤษตัวเล็ก/ตัวเลข . _ -" required>
      <label for="f-pass">รหัสผ่าน</label><input id="f-pass" type="password" minlength="6" autocomplete="${S.mode==='login'?'current-password':'new-password'}" placeholder="อย่างน้อย 6 ตัวอักษร" required>
      ${S.mode==='signup'?`<label for="f-pass2">ยืนยันรหัสผ่าน</label><input id="f-pass2" type="password" autocomplete="new-password" required>
      <label for="f-plat">แพลตฟอร์มหลัก</label><select id="f-plat"><option>Facebook Reels</option><option>Instagram Reels</option><option selected>ทั้ง 2 อย่าง</option></select>`:''}
      ${S.err?`<div class="err" role="alert">${esc(S.err)}</div>`:''}
      <button class="btn w" style="margin-top:18px" ${S.busy?'disabled':''}>${S.mode==='login'?'เข้าสู่ระบบ':'สมัครสมาชิก'}</button>
    </form>
  </div>
</div>`;

const coverHtml = r => `<div class="cover" style="background:${grad(r.title + (r.owner_name||''))}">${httpsUrl(r.cover)?`<img src="${httpsUrl(r.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:''}<span>${esc(r.title)}</span></div>`;

view.feedCard = r => {
  const mine = r.owner_id === S.me.id;
  const done = S.myHelps.some(h => h.reel_id === r.id && h.helped_date === today());
  return `<article class="card">
    <div class="row"><div class="av" style="background:${esc(r.owner_color)}33;color:${esc(r.owner_color)}">${esc(ini(r.owner_name))}</div>
      <div class="grow"><b>${esc(r.owner_name)}</b><div class="muted">${esc(r.platform)} Reels</div></div>
      ${r.pinned?'<span class="pill a">📌 ปักหมุด</span>':''}</div>
    <div class="row" style="margin:10px 0"><span class="pill a">อันดับที่ ${r.rank} ในฟีด</span><span class="pill">⭐ ช่วยเพื่อน ${r.owner_helped} งาน</span></div>
    ${coverHtml(r)}
    <div class="row" style="margin-top:10px;justify-content:space-between"><span class="muted">ความคืบหน้า</span><b>${r.progress}/${r.goal} คน</b></div>
    <div class="bar"><i style="width:${pct(r.progress, r.goal)}%"></i></div>
    <div class="row" style="margin-top:12px">
      ${mine?'<span class="muted">คลิปของคุณ</span>':`<button class="btn grow" data-act="help" data-id="${esc(r.id)}" ${done?'disabled':''}>${done?'ช่วยแล้ววันนี้':'ช่วยเพื่อน +'+S.set.point_per_help}</button>
      ${S.set.report_on?`<button class="btn g" data-act="report" data-id="${esc(r.id)}">แจ้งไม่พบตะกร้า</button>`:''}`}
    </div></article>`;
};

view.gateBanner = () => {
  const g = S.gate; if (!g || g.ok !== false || !g.required) return '';
  return `<div class="warn">⚠️ ต้องช่วยงานเพื่อนอีก ${g.need} งาน ถึงจะลงคลิปต่อไปได้ (ช่วยแล้ว ${g.helped}/${g.required})
    <div class="bar" style="margin-top:8px"><i style="width:${pct(g.helped, g.required)}%"></i></div></div>`;
};

view.feed = () => `
  ${view.gateBanner()}
  <div class="row" style="margin:14px 0">${['ทั้งหมด','Facebook','Instagram'].map(p => `<button class="btn ${S.platform===p?'':'g'} s" data-act="plat" data-v="${p}">${p==='ทั้งหมด'?'ฟีดทั้งหมด':'ฟีด '+p}</button>`).join('')}
    <span class="muted" style="margin-left:auto">${S.feed.length} คลิป • คนละ 1 คลิป ช่วยเยอะขึ้นก่อน</span></div>
  ${S.feed.length ? `<div class="grid c2">${S.feed.map(view.feedCard).join('')}</div>` : `<div class="card" style="text-align:center;padding:40px"><div style="font-size:30px">🎬</div><b>ยังไม่มีคลิป</b><p class="muted">เป็นคนแรกที่วางลิงก์ Reel</p></div>`}
  <div class="card" style="margin-top:16px"><b>การช่วยล่าสุดของฉัน</b>
    ${S.myHelps.slice(0, 5).map(h => `<div class="sub row" style="margin-top:8px"><div class="grow"><b>${esc(h.clip_title)}</b><div class="muted">พิมพ์ว่า “${esc(h.typed)}” • ${fmt(h.created_at)}</div></div><span class="pill ${h.status==='ตรงกัน'?'g':h.status==='ไม่ตรง'?'r':'a'}">${esc(h.status)}</span></div>`).join('') || '<p class="muted">ยังไม่มีการช่วย</p>'}
  </div>`;

view.history = () => `
  ${view.gateBanner()}
  <div class="card" style="margin-top:14px"><div class="row"><div class="grow"><b>ประวัติงานของฉัน</b><div class="muted">คลิปที่คุณเพิ่มทั้งหมด ${S.myReels.length} คลิป</div></div><button class="btn" data-act="add">+ เพิ่ม Reel</button></div>
  ${S.myReels.map(r => `<div class="sub" style="margin-top:10px"><b>${esc(r.title)}</b>
    <div class="muted">${esc(r.platform)} • ${r.progress}/${r.goal} คน • ${esc(r.status)} • ${fmt(r.posted_at)}</div>
    <div class="muted">ตะกร้า: ${esc((r.basket||[]).join(', '))}</div>
    <div class="bar" style="margin:6px 0"><i style="width:${pct(r.progress, r.goal)}%"></i></div>
    <a href="${safeUrl(r.link)}" target="_blank" rel="noopener noreferrer nofollow">เปิดลิงก์ Reel ↗</a></div>`).join('') || '<p class="muted" style="text-align:center;padding:24px">ยังไม่มีคลิป กดเพิ่ม Reel แล้ววางลิงก์แรกได้เลย</p>'}</div>`;

view.board = () => `<div class="card" style="margin-top:14px"><b>Leaderboard — คนช่วยเพื่อนเยอะสุด</b>
  ${S.board.map(u => `<div class="sub row" style="margin-top:8px"><b style="width:32px;text-align:center">${u.rank<=3?['🥇','🥈','🥉'][u.rank-1]:u.rank}</b>
   <div class="av" style="background:${esc(u.color)}33;color:${esc(u.color)}">${esc(ini(u.display_name))}</div>
   <div class="grow"><b>${esc(u.display_name)}</b><div class="muted">@${esc(u.username)}</div></div>
   <div style="text-align:right"><b style="color:#4ade80">${u.helped} ครั้ง</b><div class="muted">${u.stars} ดาว</div></div></div>`).join('') || '<p class="muted">ยังไม่มีสมาชิก</p>'}</div>`;

/* ----- แอดมิน (สิทธิ์ตรวจจากบทบาทในฐานข้อมูลเท่านั้น ไม่มีรหัสลับฝั่งหน้าเว็บ) ----- */
const ATABS = [['overview','ภาพรวม'],['users','สมาชิก'],['reels','Reel'],['helps','ตรวจการช่วย'],['reports','รายงาน'],['credits','เครดิต'],['settings','ตั้งค่า']];
view.admin = () => {
  const A = S.adm; if (!A) return '<p class="muted">กำลังโหลด…</p>';
  const tabs = `<div class="tabs" style="margin-top:14px">${ATABS.map(([k, l]) => `<button class="${S.atab===k?'on':''}" data-act="atab" data-v="${k}">${l}${k==='reports'&&A.reports.filter(r=>r.status==='รอตรวจสอบ').length?' ('+A.reports.filter(r=>r.status==='รอตรวจสอบ').length+')':''}</button>`).join('')}</div>`;
  return tabs + `<div style="margin-top:14px">${view['a_' + S.atab](A)}</div>`;
};
view.a_overview = A => `<div class="grid c4">
  ${[['สมาชิก',A.users.length,'#2f7dff'],['Reels',A.reels.length,'#22d3ee'],['ครั้งที่ช่วย',A.users.reduce((s,u)=>s+u.helped,0),'#22c55e'],['รายงานค้าง',A.reports.filter(r=>r.status==='รอตรวจสอบ').length,'#f59e0b']].map(([l,v,c]) => `<div class="card"><div class="muted">${l}</div><div class="stat" style="color:${c}">${v}</div></div>`).join('')}</div>`;
view.a_users = A => `<div class="grid c2">${A.users.map(u => `<div class="card"><div class="row"><div class="av" style="background:${esc(u.color)}33;color:${esc(u.color)}">${esc(ini(u.display_name))}</div>
  <div class="grow"><b>${code(u)} ${esc(u.display_name)}</b><div class="muted">@${esc(u.username)} • ${u.role==='admin'?'แอดมิน':'สมาชิก'}</div></div>${u.suspended?'<span class="pill r">ระงับ</span>':'<span class="pill g">ใช้งาน</span>'}</div>
  <div class="row" style="margin:8px 0"><span class="pill">ช่วย ${u.helped}</span><span class="pill">ได้รับ ${u.received}</span><span class="pill a">⭐ ${u.stars}</span>${u.warnings?`<span class="pill a">ใบเตือน ${u.warnings}</span>`:''}${(u.tags||[]).map(t=>`<span class="pill b">${esc(t)}</span>`).join('')}${u.honor?'<span class="pill a">🏅 เกียรติยศ</span>':''}</div>

      ${S.err?`<div class="err">${esc(S.err)}</div>`:''}<button class="btn w" style="margin-top:12px">โพสต์ขอช่วยเลย</button></form>`;
  } else if (m.t === 'report') {

    ${S.err?`<div class="err">${esc(S.err)}</div>`:''}<button class="btn w" style="margin-top:12px">ส่งรายงาน</button></form>`;

    const u = S.me;

function render() {
  const active = document.activeElement?.id;
  const keep = {};
  document.querySelectorAll('#app input[id],#app textarea[id],#app select[id]').forEach(i => { keep[i.id] = i.type === 'checkbox' ? i.checked : i.value; });
  $('app').innerHTML = !S.ready ? '<div class="auth muted">กำลังโหลด…</div>' : !S.me ? view.auth() : view.app() + view.modal();
  for (const id in keep) { const el = $(id); if (!el) continue; if (el.type === 'checkbox') el.checked = keep[id]; else el.value = keep[id]; }
  if (active && $(active)) $(active).focus();
}

/* ============ การกระทำ ============ */
const A = {
  mode: el => { S.mode = el.dataset.v; S.err = ''; render(); },
  tab: async el => { S.tab = el.dataset.v; if (S.tab === 'admin') await loadAdmin(); render(); },
  atab: el => { S.atab = el.dataset.v; render(); },
  plat: async el => { S.platform = el.dataset.v; await load(); },
  help: el => { S.modal = { t: 'help', id: el.dataset.id }; S.err = ''; render(); },
  add: () => { S.modal = { t: 'add' }; S.err = ''; render(); },
  report: el => { S.modal = { t: 'report', id: el.dataset.id }; S.err = ''; render(); },
  me: () => { S.modal = { t: 'me' }; render(); },
  close: () => { S.modal = null; S.err = ''; render(); },
  mask: (el, e) => { if (e.target === el) A.close(); },
  logout: async () => { await sb.auth.signOut(); S.me = null; S.modal = null; S.adm = null; S.tab = 'feed'; render(); },
  'u-suspend': el => adminUser(el, u => ({ suspended: !u.suspended }), 'อัปเดตสถานะแล้ว'),
  'u-warn': el => adminUser(el, u => ({ warnings: u.warnings + 1, status: u.status === 'แบน' ? 'แบน' : 'เตือน' }), 'เพิ่มใบเตือนแล้ว'),
  'u-honor': el => adminUser(el, u => ({ honor: !u.honor }), 'อัปเดตแล้ว'),
  'u-tag': el => adminUser(el, u => { const t = u.tags || [], v = el.dataset.v; return { tags: t.includes(v) ? t.filter(x => x !== v) : [...t, v] }; }, 'อัปเดตป้ายแล้ว'),
  'r-status': el => go(async () => must(await sb.from('reels').update({ status: el.dataset.v }).eq('id', el.dataset.id)), 'อัปเดตคลิปแล้ว'),
  'r-pin': el => go(async () => must(await sb.from('reels').update({ pinned: el.dataset.v === '1' }).eq('id', el.dataset.id)), 'อัปเดตแล้ว'),
  'r-del': el => { if (confirm('ลบคลิปนี้ถาวร?')) go(async () => must(await sb.from('reels').delete().eq('id', el.dataset.id)), 'ลบคลิปแล้ว'); },
  'h-ok': el => go(async () => must(await sb.from('helps').update({ status: 'ตรงกัน' }).eq('id', el.dataset.id)), 'อนุมัติแล้ว'),
  'h-no': el => go(async () => must(await sb.rpc('admin_reject_help', { p_help: el.dataset.id, p_deduct: false })), 'ปฏิเสธแล้ว'),
  'h-deduct': el => { if (confirm('ปฏิเสธและตัดเครดิต 10 ดาว?')) go(async () => must(await sb.rpc('admin_reject_help', { p_help: el.dataset.id, p_deduct: true })), 'ตัดเครดิตแล้ว'); },
  'p-ok': el => go(async () => must(await sb.from('reports').update({ status: 'ตรวจสอบแล้ว' }).eq('id', el.dataset.id)), 'บันทึกแล้ว'),
  'p-pause': el => go(async () => {
    const r = S.adm.reports.find(x => x.id === el.dataset.id);
    must(await sb.from('reports').update({ status: 'พักคลิปแล้ว' }).eq('id', r.id));
    must(await sb.from('reels').update({ status: 'หยุดแสดง' }).eq('id', r.reel_id));
  }, 'พักคลิปแล้ว'),
  'p-del': el => go(async () => must(await sb.from('reports').delete().eq('id', el.dataset.id)), 'ลบรายงานแล้ว')
};
function adminUser(el, patch, msg) {
  const u = S.adm.users.find(x => x.id === el.dataset.id);
  return go(async () => must(await sb.from('profiles').update(patch(u)).eq('id', u.id)), msg);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});

const F = {
  login: () => go(async () => {
    const u = val('f-user').toLowerCase();
    must(await sb.auth.signInWithPassword({ email: u + '@reelmate.app', password: $('f-pass').value }));
  }),
  signup: () => {
    const name = val('f-name'), u = val('f-user').toLowerCase(), p = $('f-pass').value;
    if (!/^[a-z0-9._-]{3,30}$/.test(u)) { S.err = 'ชื่อผู้ใช้ 3–30 ตัว ใช้ a-z 0-9 . _ - เท่านั้น'; return render(); }
    if (p.length < 6) { S.err = 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร'; return render(); }
    if (p !== $('f-pass2').value) { S.err = 'รหัสผ่านไม่ตรงกัน'; return render(); }
    return go(async () => {
      const { data, error } = await sb.auth.signUp({ email: u + '@reelmate.app', password: p,
        options: { data: { username: u, display_name: name, platform_pref: val('f-plat') } } });
      if (error) throw error;
      if (!data.session) throw new Error('สมัครแล้ว แต่ระบบยังเปิดยืนยันอีเมลอยู่ — ให้แอดมินปิด “Confirm email” ใน Supabase Auth ก่อน');
    }, 'สมัครสำเร็จ ยินดีต้อนรับ!');
  },
  help: form => go(async () => must(await sb.rpc('submit_help', { p_reel_id: form.dataset.id, p_typed: val('h-typed') })), 'ช่วยสำเร็จ!'),
  add: () => {
    const link = val('a-link');
    if (!REEL_RE.test(link)) { S.err = 'ลิงก์ต้องเป็น Reel ของ Facebook หรือ Instagram เท่านั้น'; return render(); }
    const platform = /instagram\.com|instagr\.am/i.test(link) ? 'Instagram' : 'Facebook';
    const cover = val('a-cover');
    return go(async () => must(await sb.rpc('create_reel', { p_title: val('a-title'), p_platform: platform, p_link: link, p_basket: val('a-basket'), p_cover: /^https:\/\//i.test(cover) ? cover : null })), 'โพสต์สำเร็จ รอเพื่อนมาช่วย');
  },
  report: form => go(async () => must(await sb.from('reports').insert({ reporter_id: S.me.id, reel_id: form.dataset.id, reason: val('p-why') })), 'ส่งรายงานแล้ว'),
  credit: () => go(async () => must(await sb.rpc('admin_adjust_credit', { p_user: val('c-user'), p_kind: val('c-kind'), p_amount: Number(val('c-amt')), p_reason: val('c-why') })), 'ปรับเครดิตแล้ว'),
  settings: () => go(async () => {
    const patch = { updated_at: new Date().toISOString() };
    SET_FIELDS.forEach(([k]) => patch[k] = Number(val('s-' + k)));
    ['report_on', 'ig_follow_on', 'mode200_enabled'].forEach(k => patch[k] = $('s-' + k).checked);
    must(await sb.from('settings').update(patch).eq('id', 1));
  }, 'บันทึกการตั้งค่าแล้ว')
};
document.addEventListener('submit', e => {
  const form = e.target.closest('[data-form]'); if (!form) return;
  e.preventDefault();
  const fn = F[form.dataset.form]; if (fn) fn(form);
});

// ห้ามเรียก supabase แบบ await ตรงๆ ใน callback นี้ (อาจ deadlock) จึงเลื่อนไปรอบถัดไป
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') setTimeout(load, 0); });
load().catch(e => { S.ready = true; S.err = niceErr(e); render(); });
</script>
</body>
