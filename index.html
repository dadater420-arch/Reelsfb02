<html lang="th">
<head>

<title>reelmate</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d13;--surface:#12161f;--surface2:#171c28;--surface3:#1e2534;--line:#242c3d;--text:#eef2f8;--muted:#9aa7bd;--primary:#2f7dff;--primary2:#4d9bff;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--cyan:#22d3ee}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Kanit',system-ui,sans-serif;line-height:1.5;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}
button:disabled{opacity:.5;cursor:not-allowed}
a{color:var(--primary2);overflow-wrap:anywhere}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(47,125,255,.18)}
input[type=checkbox]{width:20px;height:20px;padding:0}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
.wrap{max-width:1100px;margin:0 auto;padding:12px 14px 40px}
.auth{max-width:440px;margin:0 auto;padding:40px 16px}
.logo{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:800}
.logo b{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--primary);box-shadow:0 8px 20px rgba(47,125,255,.3)}
.logo i{font-style:normal;color:var(--primary2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
.sub{background:var(--surface2);border-radius:16px;padding:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.grid{display:grid;gap:12px}
@media(min-width:720px){.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c4{grid-template-columns:repeat(4,1fr)}}
.btn{padding:11px 16px;border-radius:12px;background:var(--primary);color:#fff;font-weight:700;font-size:14px}
.btn:hover:not(:disabled){background:var(--primary2)}
.btn.g{background:rgba(255,255,255,.1)}.btn.r{background:rgba(239,68,68,.18);color:#fca5a5}.btn.ok{background:var(--green);color:#04130a}.btn.a{background:rgba(245,158,11,.2);color:#fcd34d}
.btn.s{padding:8px 12px;font-size:12px}.btn.w{width:100%}
.tabs{position:relative;display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:16px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;padding:10px 14px;border-radius:12px;background:none;color:var(--muted);font-weight:700;font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--primary);color:#fff}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(255,255,255,.08);color:var(--muted)}
.pill.g{background:#22c55e22;color:#4ade80}.pill.a{background:#f59e0b22;color:#fbbf24}.pill.r{background:#ef444422;color:#f87171}.pill.b{background:#2f7dff22;color:#7db4ff}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#22d3ee)}
.muted{color:var(--muted);font-size:13px}
.cover{position:relative;height:180px;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#fff}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover span{position:relative;font-weight:700;text-shadow:0 1px 4px #0008}
.err{background:#ef444418;color:#f87171;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:10px}
.warn{background:#f59e0b18;border:1px solid #f59e0b55;color:#fcd34d;border-radius:16px;padding:12px 14px;font-size:13px;font-weight:600;margin-top:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0b2a17;border:1px solid #22c55e66;padding:12px 18px;border-radius:14px;z-index:99;font-weight:600;max-width:90vw}
.toast.bad{background:#2a0b0b;border-color:#ef444466}
.mask{position:fixed;inset:0;background:#000b;z-index:50;display:grid;place-items:center;padding:14px}
.modal{width:min(480px,100%);max-height:90vh;overflow:auto;background:var(--surface2);border:1px solid var(--line);border-radius:24px;padding:20px;position:relative}
.modal h3{margin:0 0 4px;font-size:19px}
.x{position:absolute;right:14px;top:14px;background:rgba(255,255,255,.1);border-radius:10px;width:34px;height:34px}
.head{position:sticky;top:0;z-index:20;background:#0a0d13ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700}
.stat{font-size:26px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 6px;text-align:left;border-bottom:1px solid #ffffff10}
.scroll{overflow-x:auto}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:#000a;display:grid;place-items:center;pointer-events:none}
.steps2{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:700;margin:14px 0 4px}.steps2 span{padding:6px 12px;border-radius:99px;background:var(--surface);color:var(--muted)}.steps2 span.on{background:var(--primary);color:#fff}
.pwrap{position:relative}.pwrap button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);border-radius:10px;padding:6px 9px}
.pills3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}.pills3 button{padding:11px 4px;border-radius:12px;background:var(--surface2);color:var(--muted);font-size:12px;font-weight:700}.pills3 button.on{background:var(--primary);color:#fff}
body.busy #app{pointer-events:none}
body.busy{cursor:progress}
.topbar{position:fixed;left:0;top:0;height:3px;width:100%;z-index:300;background:linear-gradient(90deg,transparent,#4d9bff,#22d3ee,transparent) no-repeat;background-size:50% 100%;animation:bar 1s linear infinite}
@keyframes bar{from{background-position:-50% 0}to{background-position:150% 0}}
.bchip{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:300;display:flex;gap:10px;align-items:center;max-width:92vw;background:var(--surface2);border:1px solid var(--line);padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;box-shadow:0 8px 30px #0008;opacity:0;animation:fin .2s .6s forwards}
@keyframes fin{to{opacity:1}}
.spin{width:16px;height:16px;flex:0 0 16px;border-radius:50%;border:2px solid rgba(255,255,255,.15);border-top-color:var(--primary2);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* ---- แอดมิน ---- */
.ah{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:16px}.ah h2{margin:0;font-size:21px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(min-width:960px){.kpis{grid-template-columns:repeat(6,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.kpi small{display:block;color:var(--muted);font-size:12px}.kpi b{font-size:26px;line-height:1.3}
.todo{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:8px;font-weight:600;font-size:14px}
.todo .n{margin-left:auto}
.badge{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:99px;background:#f59e0b;color:#1a1100;font-size:11px;font-style:normal;font-weight:800;line-height:18px;text-align:center}
.fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px 0 4px}.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:0 0 auto;padding:7px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:600}.fchips button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:10px}.grid>.acard{margin-top:0}
.astat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.astat div{background:var(--surface2);border-radius:12px;padding:8px;text-align:center}.astat b{display:block;font-size:17px}.astat small{color:var(--muted);font-size:11px}
details.mg{margin-top:10px}details.mg summary{cursor:pointer;list-style:none;padding:10px 12px;border-radius:12px;background:var(--surface2);font-size:13px;font-weight:700;color:var(--muted)}details.mg summary::-webkit-details-marker{display:none}details.mg[open] summary{color:var(--text)}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.agrid .btn{padding:10px 6px;font-size:13px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.cmp>div{background:var(--surface2);border-radius:12px;padding:10px}.cmp small{display:block;color:var(--muted);font-size:11px}.cmp b{font-size:14px;overflow-wrap:anywhere}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 label{font-size:12px;margin-top:6px}
.sw{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:8px;font-size:14px;font-weight:600}.sw input{margin-left:auto;flex:0 0 20px}
.asec{margin:20px 2px 0;font-size:13px;font-weight:700;color:var(--muted)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hs{grid-template-columns:repeat(3,1fr)!important;gap:8px}.hs .sub{padding:10px}.head .btn{white-space:nowrap}@media(max-width:560px){.head #q-search{order:10;flex:1 1 100%;max-width:none}}
</style>

<body>
<div id="app"></div>
<div id="toast"></div>
<div id="prog"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script>
'use strict';
/* ============ ตั้งค่า (publishable key เปิดเผยได้ ความปลอดภัยอยู่ที่ RLS ฝั่งฐานข้อมูล) ============ */
const SB_URL = 'https://hajdefougllyugmamwdn.supabase.co';
const SB_KEY = 'sb_publishable_nfamPECiovzrLjkzPtTOJg_E9MDNb75';
const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

/* ============ ตัวช่วย ============ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? esc(u) : '#';
const httpsUrl = u => /^https:\/\//i.test(u || '') ? esc(u) : '';
const REEL_RE = /^https?:\/\/([a-z0-9-]+\.)*(facebook\.com|fb\.watch|fb\.com|fb\.gg|instagram\.com|instagr\.am)(\/|$)/i;
const fmt = d => new Date(d).toLocaleString('th-TH', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
const today = () => new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Bangkok'}).format(new Date());
const code = p => 'RM' + String(p.member_no).padStart(3, '0');
const ini = s => (s || '?').trim().slice(0, 1).toUpperCase();
const GRAD = ['#2563eb,#06b6d4','#7c3aed,#db2777','#059669,#14b8a6','#ea580c,#f43f5e','#1d4ed8,#7c3aed'];
const grad = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `linear-gradient(135deg,${GRAD[h % GRAD.length]})`; };
const pct = (a, b) => Math.min(100, Math.round(a / Math.max(1, b) * 100));
const $ = id => document.getElementById(id);
const val = id => ($(id)?.value ?? '').trim();

let tt; function toast(msg, bad) {
  $('toast').innerHTML = `<div class="toast ${bad ? 'bad' : ''}">${esc(msg)}</div>`;
  clearTimeout(tt); tt = setTimeout(() => $('toast').innerHTML = '', 3500);
}
const niceErr = e => {
  const m = e?.message || String(e);
  if (/Invalid login/i.test(m)) return 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
  if (/already registered|duplicate key|profiles_username_key/i.test(m)) return 'ชื่อผู้ใช้นี้มีคนใช้แล้ว';
  if (/rate limit|too many/i.test(m)) return 'ลองบ่อยเกินไป รอสักครู่แล้วลองใหม่';
  if (/Password should/i.test(m)) return 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
  return m;
};

/* ============ ดึงรูปปกจากลิงก์ Reel (ผ่าน microlink) ============ */
async function fetchCover(link) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 9000);
  try {
    const r = await fetch('https://api.microlink.io/?url=' + encodeURIComponent(link), { signal: ctl.signal });
    if (!r.ok) return null;
    const j = await r.json();
    const u = j?.data?.image?.url || j?.data?.screenshot?.url || '';
    return /^https:\/\//i.test(u) ? u : null;
  } catch { return null; } finally { clearTimeout(t); }
}
async function loadCover(force) {
  const m = S.modal; if (!m || m.t !== 'add') return;
  const link = m.link; m.coverState = 'loading'; render();
  const url = await fetchCover(link);
  if (S.modal !== m || m.step !== 2) return;
  const typed = val('a-cover'), old = m.cover;
  m.coverState = url ? 'ok' : 'fail'; if (url) m.cover = url;
  render();
  if (url && (!typed || typed === old) && $('a-cover')) $('a-cover').value = url;
}

/* ============ สถานะ ============ */
const S = { ready:false, mode:'login', me:null, set:null, tab:'feed', atab:'overview', platform:'ทั้งหมด',
  feed:[], myReels:[], myHelps:[], board:[], gate:null, modal:null, adm:null, busy:false, err:'', q:'', uq:'', uf:'all', hf:'รอตรวจ', rf:'รอตรวจสอบ', showpw:false, splat:'ทั้ง 2 อย่าง' };
try { S.guideHidden = localStorage.getItem('rm_guide_hidden') === '1'; } catch (e) { S.guideHidden = false; }

/* ============ โหลดข้อมูล ============ */
async function load() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { S.me = null; S.ready = true; return render(); }
  const uid = session.user.id;
  const [me, set, feed, mine, helps, board, gate] = await Promise.all([
    sb.from('profiles').select('*').eq('id', uid).maybeSingle(),
    sb.from('settings').select('*').eq('id', 1).single(),
    sb.rpc('get_feed', { p_platform: S.platform === 'ทั้งหมด' ? null : S.platform }),
    sb.from('reels').select('*').eq('owner_id', uid).order('posted_at', { ascending: false }),
    sb.from('helps').select('id,reel_id,clip_title,typed,status,helped_date,created_at').eq('helper_id', uid).order('created_at', { ascending: false }).limit(50),
    sb.rpc('get_leaderboard'),
    sb.rpc('can_post_reel')
  ]);
  if (!me.data) { await sb.auth.signOut(); S.me = null; S.ready = true; return render(); }
  Object.assign(S, { me: me.data, set: set.data, feed: feed.data || [], myReels: mine.data || [],
    myHelps: helps.data || [], board: board.data || [], gate: gate.data, ready: true });
  try { const pend = JSON.parse(sessionStorage.getItem('rm_help_pending') || 'null'); sessionStorage.removeItem('rm_help_pending');
    if (pend && Date.now() - pend.t < 900000 && !S.modal && S.feed.some(x => x.id === pend.id)) S.modal = { t: 'help', id: pend.id, step: 2 }; } catch (e) {}
  if (S.me.role === 'admin' && S.tab === 'admin') await loadAdmin();
  render();
}
async function loadAdmin() {
  const [users, reels, helps, reports, credits] = await Promise.all([
    sb.from('profiles').select('*').order('member_no', { ascending: false }).limit(500),
    sb.from('reels').select('*,profiles(display_name)').order('posted_at', { ascending: false }).limit(200),
    sb.from('helps').select('*,profiles(display_name)').order('created_at', { ascending: false }).limit(200),
    sb.from('reports').select('*,profiles(display_name),reels(title,link)').order('created_at', { ascending: false }).limit(200),
    sb.from('credit_logs').select('*,profiles!credit_logs_user_id_fkey(display_name)').order('created_at', { ascending: false }).limit(100)
  ]);
  S.adm = { users: users.data || [], reels: reels.data || [], helps: helps.data || [], reports: reports.data || [], credits: credits.data || [] };
}
/* ============ ป๊อปอัพแสดงความคืบหน้า ============ */
const TITLES = {
  'อัปเดตสถานะแล้ว':'กำลังอัปเดตสถานะผู้ใช้','เพิ่มใบเตือนแล้ว':'กำลังเพิ่มใบเตือน','อัปเดตแล้ว':'กำลังอัปเดตข้อมูล',
  'อัปเดตป้ายแล้ว':'กำลังอัปเดตป้าย','อัปเดตคลิปแล้ว':'กำลังอัปเดตคลิป','ลบคลิปแล้ว':'กำลังลบคลิป',
  'อนุมัติแล้ว':'กำลังอนุมัติ','ปฏิเสธแล้ว':'กำลังปฏิเสธ','ตัดเครดิตแล้ว':'กำลังตัดเครดิต','บันทึกแล้ว':'กำลังบันทึก',
  'พักคลิปแล้ว':'กำลังพักคลิป','ลบรายงานแล้ว':'กำลังลบรายงาน','สมัครสำเร็จ ยินดีต้อนรับ!':'กำลังสมัครสมาชิก',
  'ช่วยสำเร็จ!':'กำลังบันทึกการช่วย','โพสต์สำเร็จ รอเพื่อนมาช่วย':'กำลังโพสต์คลิป','ส่งรายงานแล้ว':'กำลังส่งรายงาน',
  'ปรับเครดิตแล้ว':'กำลังปรับเครดิต','บันทึกการตั้งค่าแล้ว':'กำลังบันทึกการตั้งค่า'
};
const Prog = {
  slowT:null, quiet:false,
  open(title, steps, quiet) {
    clearTimeout(this.slowT); this.quiet = !!quiet;
    document.body.classList.add('busy');
    $('prog').innerHTML = `<div class="topbar"></div><div class="bchip"><div class="spin"></div><span id="btxt">${esc(title)}…</span></div>`;
    this.slowT = setTimeout(() => { const t = $('btxt'); if (t) t.textContent = 'เครือข่ายช้ากว่าปกติ รอสักครู่ อย่ากดซ้ำ…'; }, 8000);
  },
  step() {},
  finish(msg) { this.close(); if (msg && !this.quiet) toast(msg); },
  fail() { this.close(); },
  close() { clearTimeout(this.slowT); document.body.classList.remove('busy'); $('prog').innerHTML = ''; }
};
const withTimeout = (p, ms = 30000) => Promise.race([p, new Promise((_, rj) => setTimeout(() => rj(new Error('ใช้เวลานานเกินไป ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่')), ms))]);

async function go(fn, okMsg, title) {
  if (S.busy) { toast('กำลังดำเนินการอยู่ กรุณารอสักครู่', true); return; }
  S.busy = true;
  Prog.open(title || TITLES[okMsg] || 'กำลังดำเนินการ', ['ส่งคำขอไปยังเซิร์ฟเวอร์', 'บันทึกข้อมูลแล้ว', 'โหลดข้อมูลล่าสุด']);
  try {
    await withTimeout(fn());
    Prog.step(1); S.modal = null; S.err = ''; try { sessionStorage.removeItem('rm_help_pending'); } catch (e) {}
    Prog.step(2); await withTimeout(load());
    Prog.finish(okMsg || 'เสร็จเรียบร้อย');
  } catch (e) { S.err = niceErr(e); Prog.fail(niceErr(e)); toast(niceErr(e), true); render(); }
  finally { S.busy = false; if (!S.me) render(); }
}
/* งานโหลดข้อมูลทั่วไป (สลับแท็บ/ตัวกรอง/ออกจากระบบ) พร้อมป๊อปอัพ */
async function quick(title, fn) {
  if (S.busy) { toast('กำลังดำเนินการอยู่ กรุณารอสักครู่', true); return; }
  S.busy = true; Prog.open(title, [], true);
  try { await withTimeout(fn()); Prog.step(1); render(); Prog.finish('เรียบร้อย'); }
  catch (e) { Prog.fail(niceErr(e)); toast(niceErr(e), true); }
  finally { S.busy = false; if (!S.me) render(); }
}

function render() {
  const active = document.activeElement?.id;
  const keep = {};
  document.querySelectorAll('#app input[id],#app textarea[id],#app select[id]').forEach(i => { keep[i.id] = i.type === 'checkbox' ? i.checked : i.value; });
  $('app').innerHTML = !S.ready ? '<div class="auth muted">กำลังโหลด…</div>' : !S.me ? view.auth() : view.app() + view.modal();
  for (const id in keep) { const el = $(id); if (!el) continue; if (el.type === 'checkbox') el.checked = keep[id]; else el.value = keep[id]; }
  document.querySelectorAll('#app .tabs').forEach(t => { const b = t.querySelector('button.on'); if (b) t.scrollLeft = b.offsetLeft - (t.clientWidth - b.offsetWidth) / 2; });
  if (active && $(active)) $(active).focus();
}

  'help-step': el => { S.modal.step = Number(el.dataset.v); S.err = ''; render(); },
  'help-open': el => { const r = S.feed.find(x => x.id === el.dataset.id); S.modal.step = 2; render();
    if (r && /^https?:\/\//i.test(r.link || '')) { try { sessionStorage.setItem('rm_help_pending', JSON.stringify({ id: r.id, t: Date.now() })); } catch (e) {} location.assign(r.link); } },
  detail: el => { S.modal = { t: 'detail', id: el.dataset.id }; render(); },
  add: () => {
    const g = S.gate;
    if (g && g.ok === false && g.required) { toast('ต้องช่วยเพื่อนอีก ' + g.need + ' งาน ถึงจะลงคลิปได้ (ช่วยแล้ว ' + g.helped + '/' + g.required + ')', true); S.tab = 'feed'; S.modal = null; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    S.modal = { t: 'add', step: 1, link: '', title: '' }; S.err = ''; render(); },
  'add-back': () => { S.modal.title = val('a-title'); S.modal.step = 1; S.err = ''; render(); },
  paste: async () => { try { const t = await navigator.clipboard.readText(); if (t) { $('a-link').value = t.trim(); toast('วางลิงก์จากคลิปบอร์ดแล้ว'); } } catch { toast('กด Ctrl+V หรือแตะค้างในช่องลิงก์เพื่อวาง', true); } },
  'cover-refresh': () => loadCover(true),
  pw: () => { S.showpw = !S.showpw; render(); },
  'guide-close': () => { S.guideHidden = true; try { localStorage.setItem('rm_guide_hidden', '1'); } catch (e) {} render(); },
  'guide-open': () => { S.guideHidden = false; try { localStorage.removeItem('rm_guide_hidden'); } catch (e) {} render(); },
  splat: el => { S.splat = el.dataset.v; render(); },
  report: el => { S.modal = { t: 'report', id: el.dataset.id }; S.err = ''; render(); },
  me: () => { S.modal = { t: 'me' }; render(); },
  close: () => { S.modal = null; S.err = ''; try { sessionStorage.removeItem('rm_help_pending'); } catch (e) {} render(); },
  mask: (el, e) => { if (e.target === el) A.close(); },
  logout: () => quick('กำลังออกจากระบบ', async () => { await sb.auth.signOut(); S.me = null; S.modal = null; S.adm = null; S.tab = 'feed'; }),
  'u-suspend': el => adminUser(el, u => ({ suspended: !u.suspended }), 'อัปเดตสถานะแล้ว'),
  'u-warn': el => adminUser(el, u => ({ warnings: u.warnings + 1, status: u.status === 'แบน' ? 'แบน' : 'เตือน' }), 'เพิ่มใบเตือนแล้ว'),
  'u-honor': el => adminUser(el, u => ({ honor: !u.honor }), 'อัปเดตแล้ว'),
  'u-tag': el => adminUser(el, u => { const t = u.tags || [], v = el.dataset.v; return { tags: t.includes(v) ? t.filter(x => x !== v) : [...t, v] }; }, 'อัปเดตป้ายแล้ว'),
  'r-status': el => go(async () => must(await sb.from('reels').update({ status: el.dataset.v }).eq('id', el.dataset.id)), 'อัปเดตคลิปแล้ว'),
  'r-pin': el => go(async () => must(await sb.from('reels').update({ pinned: el.dataset.v === '1' }).eq('id', el.dataset.id)), 'อัปเดตแล้ว'),
  'r-del': el => { if (confirm('ลบคลิปนี้ถาวร?')) go(async () => must(await sb.from('reels').delete().eq('id', el.dataset.id)), 'ลบคลิปแล้ว'); },
  'h-ok': el => go(async () => must(await sb.from('helps').update({ status: 'ตรงกัน' }).eq('id', el.dataset.id)), 'อนุมัติแล้ว'),
  'h-ok-all': () => { const rm = new Map(S.adm.reels.map(r => [r.id, r])), n = t => String(t || '').trim().toLowerCase().replace(/\s+/g, ' ');
    const ids = S.adm.helps.filter(h => h.status === 'รอตรวจ' && n((rm.get(h.reel_id)?.basket || []).join(', ')) && n((rm.get(h.reel_id)?.basket || []).join(', ')) === n(h.typed)).map(h => h.id);
    if (!ids.length) return;
    if (confirm('อนุมัติที่ตรงเป๊ะทั้งหมด ' + ids.length + ' รายการ?')) go(async () => must(await sb.from('helps').update({ status: 'ตรงกัน' }).in('id', ids)), 'อนุมัติแล้ว'); },
  'h-no': el => go(async () => must(await sb.rpc('admin_reject_help', { p_help: el.dataset.id, p_deduct: false })), 'ปฏิเสธแล้ว'),
  'h-deduct': el => { if (confirm('ปฏิเสธและตัดเครดิต 10 ดาว?')) go(async () => must(await sb.rpc('admin_reject_help', { p_help: el.dataset.id, p_deduct: true })), 'ตัดเครดิตแล้ว'); },
  'p-ok': el => go(async () => must(await sb.from('reports').update({ status: 'ตรวจสอบแล้ว' }).eq('id', el.dataset.id)), 'บันทึกแล้ว'),
  'p-pause': el => go(async () => {
    const r = S.adm.reports.find(x => x.id === el.dataset.id);
    must(await sb.from('reports').update({ status: 'พักคลิปแล้ว' }).eq('id', r.id));
    must(await sb.from('reels').update({ status: 'หยุดแสดง' }).eq('id', r.reel_id));
  }, 'พักคลิปแล้ว'),
  'p-del': el => go(async () => must(await sb.from('reports').delete().eq('id', el.dataset.id)), 'ลบรายงานแล้ว')
};
function adminUser(el, patch, msg) {
  const u = S.adm.users.find(x => x.id === el.dataset.id);
  return go(async () => must(await sb.from('profiles').update(patch(u)).eq('id', u.id)), msg);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'mask' && e.target !== el) return; // คลิกในโมดัล ต้องไม่ preventDefault ไม่งั้นปุ่ม submit ไม่ทำงาน
  const fn = A[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});

const F = {
  login: () => go(async () => {
    const u = val('f-user').toLowerCase();
    must(await sb.auth.signInWithPassword({ email: u + '@reelmate.app', password: $('f-pass').value }));
  }, 'เข้าสู่ระบบสำเร็จ', 'กำลังเข้าสู่ระบบ'),
  signup: () => {
    const name = val('f-name'), u = val('f-user').toLowerCase(), p = $('f-pass').value;
    if (!/^[a-z0-9._-]{3,30}$/.test(u)) { S.err = 'ชื่อผู้ใช้ 3–30 ตัว ใช้ a-z 0-9 . _ - เท่านั้น'; return render(); }
    if (p.length < 6) { S.err = 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร'; return render(); }
    if (p !== $('f-pass2').value) { S.err = 'รหัสผ่านไม่ตรงกัน'; return render(); }
    return go(async () => {
      const { data, error } = await sb.auth.signUp({ email: u + '@reelmate.app', password: p,
        options: { data: { username: u, display_name: name, platform_pref: S.splat } } });
      if (error) throw error;
      if (!data.session) throw new Error('สมัครแล้ว แต่ระบบยังเปิดยืนยันอีเมลอยู่ — ให้แอดมินปิด “Confirm email” ใน Supabase Auth ก่อน');
    }, 'สมัครสำเร็จ ยินดีต้อนรับ!');
  },
  help: form => go(async () => must(await sb.rpc('submit_help', { p_reel_id: form.dataset.id, p_typed: val('h-typed') })), 'ช่วยสำเร็จ!'),
  addnext: () => {
    const link = val('a-link');
    if (!REEL_RE.test(link)) { S.err = 'ลิงก์ไม่ถูกต้อง ต้องเป็นลิงก์ Reel ของ Facebook หรือ Instagram เท่านั้น'; return render(); }
    const platform = /instagram\.com|instagr\.am/i.test(link) ? 'Instagram' : 'Facebook';
    S.modal = { t: 'add', step: 2, link, platform, title: S.modal.title || `Reel จาก ${platform}`, cover: '', coverState: 'loading' }; S.err = ''; render(); loadCover();
  },
  add: () => {
    const link = S.modal.link, platform = S.modal.platform;
    if (!REEL_RE.test(link || '')) { S.err = 'ลิงก์ไม่ถูกต้อง'; S.modal.step = 1; return render(); }
    const cover = val('a-cover');
    return go(async () => must(await sb.rpc('create_reel', { p_title: val('a-title'), p_platform: platform, p_link: link, p_basket: val('a-basket'), p_cover: /^https:\/\//i.test(cover) ? cover : null })), 'โพสต์สำเร็จ รอเพื่อนมาช่วย');
  },
  report: form => go(async () => must(await sb.from('reports').insert({ reporter_id: S.me.id, reel_id: form.dataset.id, reason: val('p-why') })), 'ส่งรายงานแล้ว'),
  credit: () => go(async () => must(await sb.rpc('admin_adjust_credit', { p_user: val('c-user'), p_kind: val('c-kind'), p_amount: Number(val('c-amt')), p_reason: val('c-why') })), 'ปรับเครดิตแล้ว'),
  settings: () => go(async () => {
    const patch = { updated_at: new Date().toISOString() };
    SET_FIELDS.forEach(([k]) => patch[k] = Number(val('s-' + k)));
    ['report_on', 'ig_follow_on', 'mode200_enabled', 'auto_approve_exact'].forEach(k => patch[k] = $('s-' + k).checked);
    must(await sb.from('settings').update(patch).eq('id', 1));
  }, 'บันทึกการตั้งค่าแล้ว')
};
document.addEventListener('input', e => { const k = { 'q-search': 'q', 'u-search': 'uq' }[e.target.id]; if (!k) return; const id = e.target.id; S[k] = e.target.value; render(); const el = $(id); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } });
document.addEventListener('submit', e => {
  const form = e.target.closest('[data-form]'); if (!form) return;
  e.preventDefault();
  const fn = F[form.dataset.form]; if (fn) fn(form);
});

// ห้ามเรียก supabase แบบ await ตรงๆ ใน callback นี้ (อาจ deadlock) จึงเลื่อนไปรอบถัดไป
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') setTimeout(load, 0); });
load().catch(e => { S.ready = true; S.err = niceErr(e); render(); });
</script>
</body>
</html>
